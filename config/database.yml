# NOTE
# The app uses 4 PostgreSQL databases, all on the same server:
#   * the primary database for ActiveRecord (domain data)
#   * the queue database for SolidQueue (jobs, recurring tasks, semaphores)
#   * the cache database for SolidCache (cache entries)
#   * the cable database for SolidCable (Action Cable pub/sub messages)
#
# All four are managed by the usual `bin/rails db:*` tasks and each keeps its
# own schema file (db/schema.rb, db/queue_schema.rb, db/cache_schema.rb, db/cable_schema.rb) and migration path.
#
# The connection URLs come from AppConf (see config/app_conf.rb); this file only
# appends the environment suffix (_development, _test<N>) to them.
#
default: &default
  pool: <%= AppConf.rails_max_threads.to_i + 3 * AppConf.job_concurrency.to_i + 5 %>
  timeout: <%= AppConf.yournaling_db_timeout_seconds.to_i * 1000 %>

postgres: &postgres
  <<: *default
  adapter: postgresql
  connect_timeout: <%= AppConf.yournaling_db_timeout_seconds.to_i * 1000 %>
  encoding: unicode
  read_timeout: <%= AppConf.yournaling_db_timeout_seconds.to_i * 1000 %>
  reconnect: true
  variables:
    statement_timeout: <%= AppConf.yournaling_db_timeout_seconds.to_i * 1000 %>

development:
  primary:
    <<: *postgres
    url: <%= "#{AppConf.yournaling_db_url}_development" %>
    migrations_paths: db/migrate
  cable:
    <<: *postgres
    url: <%= "#{AppConf.yournaling_cable_db_url}_development" %>
    migrations_paths: db/migrate_cable
  cache:
    <<: *postgres
    url: <%= "#{AppConf.yournaling_cache_db_url}_development" %>
    migrations_paths: db/migrate_cache
  queue:
    <<: *postgres
    url: <%= "#{AppConf.yournaling_queue_db_url}_development" %>
    migrations_paths: db/migrate_queue
    gssencmode: disable # to prevent crash when forking on macOS with PostgreSQL 15+

test:
  # unfortunately the _test suffix is necessary, as some `rake db:` commands
  # work against dev & test env, and TEST_ENV_NUMBER isolates parallel workers
  primary:
    <<: *postgres
    url: <%= "#{AppConf.yournaling_db_url}_test#{ENV['TEST_ENV_NUMBER']}" %>
    migrations_paths: db/migrate
  cable:
    <<: *postgres
    url: <%= "#{AppConf.yournaling_cable_db_url}_test#{ENV['TEST_ENV_NUMBER']}" %>
    migrations_paths: db/migrate_cable
  cache:
    <<: *postgres
    url: <%= "#{AppConf.yournaling_cache_db_url}_test#{ENV['TEST_ENV_NUMBER']}" %>
    migrations_paths: db/migrate_cache
  queue:
    <<: *postgres
    url: <%= "#{AppConf.yournaling_queue_db_url}_test#{ENV['TEST_ENV_NUMBER']}" %>
    migrations_paths: db/migrate_queue

production:
  primary:
    <<: *postgres
    url: <%= AppConf.yournaling_db_url %>
    migrations_paths: db/migrate
  queue:
    <<: *postgres
    url: <%= AppConf.yournaling_queue_db_url %>
    migrations_paths: db/migrate_queue
  cache:
    <<: *postgres
    url: <%= AppConf.yournaling_cache_db_url %>
    migrations_paths: db/migrate_cache
  cable:
    <<: *postgres
    url: <%= AppConf.yournaling_cable_db_url %>
    migrations_paths: db/migrate_cable
